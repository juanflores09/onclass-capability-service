openapi: 3.0.3
info:
  title: API de Capacidades
  version: 1.0.0
  description: Documentación de la API para la gestión de capacidades.

servers:
  - url: http://localhost:8080
    description: Servidor Local de Desarrollo

paths:
  /api/v1/capabilities:
    post:
      summary: Crear una nueva capacidad
      description: Recibe los datos de una capacidad con sus tecnologías, valida duplicados y la registra en el sistema.
      operationId: createCapability
      parameters:
        - in: header
          name: x-message-id
          required: true
          schema:
            type: string
          description: Identificador único del mensaje para trazabilidad
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CapabilityRequestDTO'
      responses:
        '201':
          description: Capacidad creada exitosamente
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CapabilityResponseDTO'
        '400':
          description: Parámetros inválidos, tecnologías duplicadas o error de negocio
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponseDTO'
        '500':
          description: Error interno del servidor
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponseDTO'

    get:
      summary: Listar capacidades de forma paginada
      description: Obtiene una lista paginada de capacidades con opciones de ordenamiento.
      operationId: listCapabilities
      parameters:
        - in: header
          name: x-message-id
          required: false
          schema:
            type: string
          description: Identificador único del mensaje para trazabilidad
        - in: query
          name: page
          required: false
          schema:
            type: integer
            default: 0
          description: Número de página (inicia en 0)
        - in: query
          name: size
          required: false
          schema:
            type: integer
            default: 10
          description: Cantidad de elementos por página
        - in: query
          name: sortBy
          required: false
          schema:
            type: string
            default: name
          description: Campo por el cual ordenar
        - in: query
          name: direction
          required: false
          schema:
            type: string
            enum: [ASC, DESC]
            default: ASC
          description: Dirección del ordenamiento
      responses:
        '200':
          description: Lista de capacidades paginada obtenida exitosamente
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CapabilityPageResponseDTO'
        '400':
          description: Parámetros de paginación o negocio inválidos
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponseDTO'
        '500':
          description: Error interno del servidor
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponseDTO'

  /api/v1/capabilities/validate:
    post:
      summary: Validar existencia de múltiples capacidades
      description: Comprueba si un conjunto de IDs de capacidades existen en la base de datos.
      operationId: validateCapabilities
      parameters:
        - in: header
          name: x-message-id
          required: true
          schema:
            type: string
          description: Identificador único del mensaje para trazabilidad
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CapabilityIdsRequestDTO'
      responses:
        '200':
          description: Validación completada (retorna true o false)
          content:
            application/json:
              schema:
                type: boolean
        '400':
          description: Parámetros inválidos
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponseDTO'
        '500':
          description: Error interno del servidor
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponseDTO'

  /api/v1/capabilities/find:
    post:
      summary: Buscar capacidades por una lista de IDs
      description: Retorna la lista completa de objetos de capacidades correspondientes a los IDs proporcionados.
      operationId: findCapabilitiesByIds
      parameters:
        - in: header
          name: x-message-id
          required: true
          schema:
            type: string
          description: Identificador único del mensaje para trazabilidad
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CapabilityIdsRequestDTO'
      responses:
        '200':
          description: Capacidades encontradas exitosamente
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/CapabilityResponseDTO'
        '400':
          description: Parámetros inválidos
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponseDTO'
        '500':
          description: Error interno del servidor
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponseDTO'

components:
  schemas:
    CapabilityRequestDTO:
      type: object
      required:
        - name
        - description
        - technologies
      properties:
        name:
          type: string
          example: Backend Development
        description:
          type: string
          example: Desarrollo de microservicios con Spring Boot
        technologies:
          type: array
          items:
            type: integer
            format: int64
          example: [1, 2, 3]

    CapabilityResponseDTO:
      type: object
      properties:
        id:
          type: integer
          format: int64
          example: 1
        name:
          type: string
          example: Backend Development
        description:
          type: string
          example: Desarrollo de microservicios con Spring Boot
        technologies:
          type: array
          items:
            $ref: '#/components/schemas/TechnologyResponseDTO'

    Technology:
      type: object
      properties:
        id:
          type: integer
          format: int64
          example: 1
        name:
          type: string
          example: Spring Boot
        description:
          type: string
          example: Framework reactivo

    TechnologyResponseDTO:
      type: object
      properties:
        id:
          type: integer
          format: int64
          example: 1
        name:
          type: string
          example: Spring Boot

    CapabilityIdsRequestDTO:
      type: object
      required:
        - ids
      properties:
        ids:
          type: array
          items:
            type: integer
            format: int64
          example: [1, 2]

    CapabilityPageResponseDTO:
      type: object
      properties:
        pageNumber:
          type: integer
          example: 1
        pageSize:
          type: integer
          example: 10
        totalElements:
          type: integer
          format: int64
          example: 25
        totalPages:
          type: integer
          example: 3
        content:
          type: array
          items:
            $ref: '#/components/schemas/CapabilityResponseDTO'

    ErrorDTO:
      type: object
      properties:
        code:
          type: string
          example: "ERR_01"
        message:
          type: string
          example: "Las tecnologías no pueden estar duplicadas"

    ApiResponseDTO:
      type: object
      properties:
        code:
          type: string
          example: "400"
        message:
          type: string
          example: "Bad Request"
        identifier:
          type: string
          example: "msg-987654"
        date:
          type: string
          format: date-time
          example: "2026-10-28T16:00:00Z"
        errors:
          type: array
          items:
            $ref: '#/components/schemas/ErrorDTO'