openapi: 3.0.3
info:
  title: Capability Microservice API
  description: Microservicio encargado de la gestión de capacidades, sus tecnologías asociadas y su vinculación con bootcamps.
  version: 1.0.0

servers:
  - url: http://localhost:8080
    description: Servidor Local

paths:
  /api/v1/capabilities:
    post:
      summary: Crear una nueva capacidad
      description: Registra una capacidad validando sus parámetros y asegurando que no existan tecnologías duplicadas.
      parameters:
        - name: x-message-id
          in: header
          required: false
          description: Identificador único de traza del mensaje
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CapabilityRequestDTO'
      responses:
        '201':
          description: Capacidad creada exitosamente
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CapabilityResponseDTO'
        '400':
          description: Parámetros inválidos o tecnologías duplicadas
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponseDTO'
        '500':
          description: Error interno del servidor
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponseDTO'

    get:
      summary: Listar capacidades paginadas
      description: Obtiene una lista paginada y ordenada de todas las capacidades con sus respectivas tecnologías.
      parameters:
        - name: x-message-id
          in: header
          required: false
          description: Identificador único de traza del mensaje
          schema:
            type: string
        - name: page
          in: query
          required: false
          description: Número de página (comienza en 0 por defecto)
          schema:
            type: integer
            default: 0
        - name: size
          in: query
          required: false
          description: Cantidad de elementos por página (por defecto 10)
          schema:
            type: integer
            default: 10
        - name: sortBy
          in: query
          required: false
          description: Campo por el cual ordenar (por defecto "name")
          schema:
            type: string
            default: "name"
        - name: direction
          in: query
          required: false
          description: Dirección del ordenamiento ("ASC" o "DESC")
          schema:
            type: string
            default: "ASC"
      responses:
        '200':
          description: Página de capacidades obtenida exitosamente
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PageResponseDTO_Capability'
        '400':
          description: Parámetros inválidos
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponseDTO'
        '500':
          description: Error interno del servidor
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponseDTO'

  /api/v1/capabilities/bootcamp-capabilities:
    post:
      summary: Asociar capacidades a un bootcamp
      description: Guarda la relación entre un bootcamp y una lista de capacidades.
      parameters:
        - name: x-message-id
          in: header
          required: false
          description: Identificador único de traza del mensaje
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BootcampCapabilitiesRequestDTO'
      responses:
        '201':
          description: Relación guardada exitosamente (No Content / Creado)
        '400':
          description: Parámetros inválidos
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponseDTO'
        '500':
          description: Error interno del servidor
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponseDTO'

  /api/v1/capabilities/find-by-bootcamps:
    post:
      summary: Buscar capacidades por IDs de bootcamps
      description: Retorna una lista de capacidades asociadas a los IDs de bootcamps provistos.
      parameters:
        - name: x-message-id
          in: header
          required: false
          description: Identificador único de traza del mensaje
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CapabilityIdsRequestDTO'
      responses:
        '200':
          description: Lista de capacidades encontradas
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/CapabilityResponseDTO'
        '400':
          description: Parámetros inválidos
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponseDTO'
        '500':
          description: Error interno del servidor
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponseDTO'

  /api/v1/capabilities/bootcamp/{id}:
    delete:
      summary: Eliminar capacidades y relaciones por ID de bootcamp
      description: Limpia las relaciones de bootcamp-capacidades y elimina capacidades huérfanas propagando al servicio de tecnologías.
      parameters:
        - name: id
          in: path
          required: true
          description: ID del bootcamp cuyas capacidades y relaciones se eliminarán
          schema:
            type: integer
            format: int64
        - name: x-message-id
          in: header
          required: false
          description: Identificador único de traza del mensaje
          schema:
            type: string
      responses:
        '204':
          description: Capacidades y relaciones limpiadas exitosamente (No Content)
        '400':
          description: Formato de ID inválido o error de negocio
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponseDTO'
        '500':
          description: Error interno del servidor
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponseDTO'

components:
  schemas:
    CapabilityRequestDTO:
      type: object
      required:
        - name
        - description
        - technologies
      properties:
        name:
          type: string
          example: "Fundamentos de Backend"
        description:
          type: string
          example: "Capacidad para desarrollar servicios robustos del lado del servidor"
        technologies:
          type: array
          items:
            type: integer
            format: int64
          example: [1, 2, 3]

    CapabilityResponseDTO:
      type: object
      properties:
        id:
          type: integer
          format: int64
          example: 1
        name:
          type: string
          example: "Fundamentos de Backend"
        description:
          type: string
          example: "Capacidad para desarrollar servicios robustos del lado del servidor"
        technologies:
          type: array
          items:
            $ref: '#/components/schemas/TechnologyResponseDTO'

    TechnologyResponseDTO:
      type: object
      properties:
        id:
          type: integer
          format: int64
          example: 10
        name:
          type: string
          example: "Java"
        description:
          type: string
          example: "Lenguaje de programación orientado a objetos"

    BootcampCapabilitiesRequestDTO:
      type: object
      required:
        - bootcampId
        - capabilityIds
      properties:
        bootcampId:
          type: integer
          format: int64
          example: 5
        capabilityIds:
          type: array
          items:
            type: integer
            format: int64
          example: [1, 2]

    CapabilityIdsRequestDTO:
      type: object
      required:
        - ids
      properties:
        ids:
          type: array
          items:
            type: integer
            format: int64
          example: [1, 2, 3]

    PageResponseDTO_Capability:
      type: object
      properties:
        page:
          type: integer
          example: 1
        size:
          type: integer
          example: 10
        totalElements:
          type: integer
          format: int64
          example: 25
        totalPages:
          type: integer
          example: 3
        content:
          type: array
          items:
            $ref: '#/components/schemas/CapabilityResponseDTO'

    ApiResponseDTO:
      type: object
      properties:
        code:
          type: string
          example: "INVALID_PARAMETERS"
        message:
          type: string
          example: "The provided parameters are invalid."
        identifier:
          type: string
          example: "msg-uuid-1234"
        date:
          type: string
          example: "2026-11-02T16:30:00Z"
        errors:
          type: array
          items:
            $ref: '#/components/schemas/ErrorDTO'

    ErrorDTO:
      type: object
      properties:
        code:
          type: string
          example: "INVALID_PARAMETERS"
        message:
          type: string
          example: "El campo name no puede estar vacío"